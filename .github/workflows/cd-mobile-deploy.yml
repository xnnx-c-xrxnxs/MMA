name: 'CD: Mobile Deploy'

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'EAS action'
        required: true
        default: 'update'
        type: choice
        options:
          - update      # OTA JS-only push (fast)
          - build       # produce native binary
          - build-and-submit # build + submit to stores
      profile:
        description: 'EAS build/update profile'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: 'Target platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      message:
        description: 'OTA update message (only used for update action)'
        required: false
        default: 'Update from CI'
        type: string

permissions:
  contents: read

# Cancel in-flight runs targeting the same profile+platform combo.
concurrency:
  group: mobile-deploy-${{ github.event.inputs.profile }}-${{ github.event.inputs.platform }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: 'EAS ${{ github.event.inputs.action }} (${{ github.event.inputs.profile }})'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 'EAS update (OTA)'
        if: github.event.inputs.action == 'update'
        working-directory: apps/mobile
        run: |
          eas update \
            --branch ${{ github.event.inputs.profile }} \
            --message "${{ github.event.inputs.message }}" \
            --platform ${{ github.event.inputs.platform }} \
            --non-interactive

      - name: 'EAS build'
        if: github.event.inputs.action == 'build' || github.event.inputs.action == 'build-and-submit'
        working-directory: apps/mobile
        run: |
          eas build \
            --profile ${{ github.event.inputs.profile }} \
            --platform ${{ github.event.inputs.platform }} \
            --non-interactive \
            --no-wait

      - name: 'EAS submit'
        if: github.event.inputs.action == 'build-and-submit' && github.event.inputs.profile == 'production'
        working-directory: apps/mobile
        run: |
          eas submit \
            --profile production \
            --platform ${{ github.event.inputs.platform }} \
            --non-interactive \
            --latest
