name: "🐛 Bug Report"
description: "Report a defect in production, staging, dev, or local development."
title: "[BUG] "
labels: ["type-bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        Use this template for defects only. For new features use **📋 User Story**.

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "S0 = production down. S1 = major regression. S2 = workaround exists. S3 = cosmetic."
      options:
        - "S0 — Production down"
        - "S1 — Major regression / broken flow"
        - "S2 — Bug with workaround"
        - "S3 — Cosmetic / minor"
      default: 1
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      options:
        - "Critical (P0)"
        - "High (P1)"
        - "Medium (P2)"
        - "Low (P3)"
      default: 1
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: "Domain"
      description: "Which bounded context is affected? See `.github/issue-config.json` for valid values. (Auto-populated as a dropdown after `/sync-notebooklm-output` runs.)"
      placeholder: "e.g. user, order, webapp"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      options:
        - "Production"
        - "Staging"
        - "Dev"
        - "Preview"
        - "Local"
      default: 0
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: "Effort to fix (estimate)"
      options:
        - "XS (≤ 2h)"
        - "S (≤ 8h)"
        - "M (≤ 16h)"
        - "L (≤ 32h)"
        - "XL (> 32h)"
        - "Unknown"
      default: 5
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "One-sentence description of the bug."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behaviour"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behaviour"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs / Stack Trace / CloudWatch correlationId"
      description: "Paste relevant logs. Include `correlationId` from structured logs if available — it traces the request end-to-end."
      render: text
    validations:
      required: false

  - type: textarea
    id: touches
    attributes:
      label: "Suspected Files (file globs)"
      description: "Paths likely involved. Used by `/triage-sprint` to bundle related fixes."
      placeholder: |
        packages/{domain}-domain/**
        apps/{domain}/{domain}-api-service/**
    validations:
      required: false

  - type: textarea
    id: blocked-by
    attributes:
      label: "Blocked by"
      placeholder: |
        #123
    validations:
      required: false
